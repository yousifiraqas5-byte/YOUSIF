<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهندس يوسف غسان</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
to bottom,
#CE1126 33%,
white 33%,
white 66%,
#000000 66%
);

}

.container{

width:90%;
max-width:700px;

background:rgba(255,255,255,.92);

padding:40px;

border-radius:20px;

box-shadow:0 0 25px rgba(0,0,0,.4);

text-align:center;

}

h1{

font-size:55px;

color:#0d6efd;

margin-bottom:10px;

}

h2{

font-size:28px;

margin-bottom:25px;

}

p{

font-size:22px;

margin-bottom:25px;

}

button{

background:#0d6efd;

color:white;

padding:15px 35px;

font-size:22px;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#084298;

transform:scale(1.05);

}

#result{

margin-top:30px;

font-size:28px;

font-weight:bold;

color:#006400;

}

</style>

</head>

<body>

<div class="container">

<h1>مهندس يوسف غسان</h1>

<h2>🇮🇶 Mechanical Engineer 🇮🇶</h2>

<p>
أهلاً وسهلاً بكم في موقعي الشخصي
</p>

<button onclick="birthDay()">
اعرف يوم ولادتك
</button>

<p id="result"></p>

</div>

<script>

function birthDay(){

let date=prompt("أدخل تاريخ ميلادك بالشكل التالي:\n2000-05-15");

if(date==null || date=="") return;

let d=new Date(date);

if(isNaN(d)){
alert("الرجاء إدخال التاريخ بالشكل الصحيح");
return;
}

let days=[
"الأحد",
"الاثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"
];

document.getElementById("result").innerHTML=
"🎉 لقد ولدت يوم <br><br><span style='color:#0d6efd;'>"+days[d.getDay()]+"</span>";

}

</script>

</body>

</html>
