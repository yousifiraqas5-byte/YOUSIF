<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهندس يوسف غسان</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<img src="images/italy.png" class="italy-flag">

<div class="container">

<h1>مهندس يوسف غسان</h1>

<h2>🇮🇶 Mechanical Engineer 🇮🇶</h2>

<p>
أهلاً وسهلاً بكم في موقعي الشخصي
</p>

<button onclick="birthDay()">
اعرف يوم ولادتك
</button>

<p id="result"></p>

</div>


<script>

function birthDay(){

let date=prompt("أدخل تاريخ ميلادك بالشكل التالي:\n2000-05-15");

if(date==null || date=="") return;

let d=new Date(date);

if(isNaN(d)){
alert("الرجاء إدخال التاريخ بالشكل الصحيح");
return;
}

let days=[
"الأحد",
"الاثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"
];

document.getElementById("result").innerHTML =
"🎉 لقد ولدت يوم <br><br><span>"+days[d.getDay()]+"</span>";

}

</script>

</body>
</html>
