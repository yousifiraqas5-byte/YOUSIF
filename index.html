<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>موقعي</title>


<style>

/* ضع هنا كود التصميم CSS */

.register-btn{
position:fixed;
right:20px;
top:20px;
background:#667eea;
color:white;
padding:15px;
border:none;
border-radius:10px;
cursor:pointer;
}


/* النافذة */
.modal-overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0008;
align-items:center;
justify-content:center;
}


.modal-overlay.active{
display:flex;
}


.modal{
background:white;
padding:30px;
border-radius:15px;
}


</style>

</head>


<body>


<h1>مهندس يوسف غسان</h1>

<h2>🇮🇶 Mechanical Engineer 🇮🇶</h2>


<!-- زر التسجيل -->
<button class="register-btn" onclick="openRegister()">
📝 التسجيل
</button>



<!-- النافذة -->
<div class="modal-overlay" id="box">


<div class="modal">


<button onclick="closeRegister()">❌</button>


<h2>اختر نوع التسجيل</h2>


<button onclick="maintenance()">
🔧 صيانة
</button>


<button onclick="seller()">
🏪 بائع
</button>



<div id="services" style="display:none">

<h3>اختصاص الصيانة</h3>

<button>🔨 حداد</button>

<button>🚗 صدر سيارات</button>

<button>🔧 فيتر</button>

<button>⚡ كهربائي</button>

<button>🛋️ صيانة صالات</button>

<button>🧹 تنظيف</button>

</div>



<div id="shop" style="display:none">

<h3>بيانات البائع</h3>

<input placeholder="اسم المحل">

<input placeholder="رقم الهاتف">

</div>


</div>

</div>



<script>


function openRegister(){

document.getElementById("box").classList.add("active");

}



function closeRegister(){

document.getElementById("box").classList.remove("active");

}



function maintenance(){

document.getElementById("services").style.display="block";

document.getElementById("shop").style.display="none";

}



function seller(){

document.getElementById("shop").style.display="block";

document.getElementById("services").style.display="none";

}


</script>


</body>

</html>
