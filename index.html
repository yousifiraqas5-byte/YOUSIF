<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مهندس يوسف غسان</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;

/* علم العراق */
background:linear-gradient(
to bottom,
#ce1126 33%,
white 33%,
white 66%,
black 66%
);

}

.container{
background:rgba(255,255,255,0.9);
padding:50px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.3);
width:90%;
max-width:700px;
}

h1{
font-size:55px;
color:#0d6efd;
margin-bottom:20px;
}

h2{
font-size:28px;
color:#222;
margin-bottom:20px;
}

p{
font-size:22px;
margin-bottom:30px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:15px 35px;
font-size:22px;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#084298;
}

</style>

</head>

<body>

<div class="container">

<h1>مهندس يوسف غسان</h1>

<h2>🇮🇶 Mechanical Engineer 🇮🇶</h2>

<p>
مرحباً بكم في موقعي الشخصي.
</p>

<button>تواصل معي</button>

</div>

</body>
</html>
