<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>واجهة مثل المثال</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="topbar">
      <div class="topbar-left">
        <img src="assets/logo-placeholder.svg" alt="logo" class="logo">
      </div>
      <div class="topbar-center">الصفحة الرئيسية</div>
      <div class="topbar-right">
        <button class="icon-btn" aria-label="notifications">
          <!-- bell SVG -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Z" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 16v-5a6 6 0 0 0-5-5.9V4a1 1 0 1 0-2 0v1.1A6 6 0 0 0 6 11v5l-1.7 1.7A1 1 0 0 0 5 19h14a1 1 0 0 0 .7-1.7L18 16z" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn menu" aria-label="menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden>
            <path d="M4 6h16M4 12h16M4 18h16" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <!-- Search -->
      <div class="search-wrap">
        <input type="search" placeholder="ادخل على ايه؟" aria-label="search">
        <button class="search-btn" aria-hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 21l-4.35-4.35" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11" cy="11" r="6" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- Carousel -->
      <div class="carousel">
        <div class="slides">
          <div class="slide"><img src="assets/slide1.svg" alt=""></div>
          <div class="slide"><img src="assets/slide2.svg" alt=""></div>
          <div class="slide"><img src="assets/slide3.svg" alt=""></div>
        </div>
        <div class="dots" id="dots"></div>
      </div>

      <!-- CTA card -->
      <section class="cta-card">
        <div class="cta-content">
          <h3>سجل خدمتك الآن</h3>
          <p>سجل خدمتك الآن واحصل على المزيد من الزيارات</p>
        </div>
        <div class="cta-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M12 7v10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 12h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="1.2"/>
          </svg>
        </div>
      </section>

      <!-- Categories -->
      <section class="categories">
        <div class="section-header">
          <h4>اكتشف الفئات</h4>
          <a href="#" class="show-all">إظهار الكل</a>
        </div>
        <div class="cat-grid">
          <div class="cat-card">
            <div class="cat-ico">
              <!-- hospital icon -->
              <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
                <path d="M12 2v6M9 5h6" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="3" y="8" width="18" height="13" rx="2" stroke="#ff7a00" stroke-width="1.4"/>
              </svg>
            </div>
            <div class="cat-title">خدمات صحية</div>
          </div>

          <div class="cat-card">
            <div class="cat-ico">
              <!-- restaurant icon -->
              <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
                <path d="M7 2v12" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 2v12" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 20h18" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="cat-title">مطاعم</div>
          </div>

          <div class="cat-card">
            <div class="cat-ico">
              <!-- government icon -->
              <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
                <path d="M12 3l9 5v2H3V8l9-5z" stroke="#ff7a00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 15h16v4H4z" stroke="#ff7a00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="cat-title">خدمات حكومية</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
      <a class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-6 9 6v9a1 1 0 0 1-1 1h-4V13H8v6H4a1 1 0 0 1-1-1V9z" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>الصفحة الرئيسية</span>
      </a>
      <a class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 20v-6" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 12h12" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>إشعارات</span>
      </a>
      <a class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 1 1 0 20" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>المفضلة</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
